<title>Tanaffus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&display=swap">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --paper:#F4F5FB; --surface:#FFFFFF; --surface-2:#EEF0F8; --surface-3:#E3E7F3;
  --line:#DDE1EE; --line-strong:#C5CBDD;
  --ink:#111733; --ink-2:#444D6E; --ink-3:#687191;
  --brand:#3346D9; --brand-strong:#2536B3; --brand-soft:#E7EAFD; --brand-ink:#FFFFFF; --logo:#3346D9;
  --marker:#FFD23F; --marker-band:rgba(255,210,63,.85);
  --ok:#0F8F5F; --ok-soft:#DDF4EA; --ok-ink:#FFFFFF;
  --warn:#9A5B00; --warn-soft:#FFF0CF;
  --bad:#C62F3A; --bad-soft:#FDE3E5;
  --teal:#0B958F; --amber:#E0900B; --pink:#D63F86; --violet:#6F46D8; --coral:#E8582E;
  --night:#0D1230; --night-2:#161D48; --night-ink:#E9ECFA; --night-ink-2:#A9B1D6;
  --grid:rgba(51,70,217,.06);
  --scan-bg:#FBFCFF; --scan-grid:rgba(51,70,217,.11); --scan-ink:#1D3A9A;
  --scrim:rgba(9,12,32,.5);
  --shadow-1:0 1px 2px rgba(17,23,51,.05),0 2px 8px rgba(17,23,51,.04);
  --shadow-2:0 2px 4px rgba(17,23,51,.04),0 16px 40px -8px rgba(17,23,51,.16);
  --shadow-3:0 30px 80px -20px rgba(17,23,51,.35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --ease:cubic-bezier(.2,.75,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --side:264px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0A0E21; --surface:#121833; --surface-2:#192041; --surface-3:#232B54;
    --line:#252E57; --line-strong:#3A4472;
    --ink:#E9ECFA; --ink-2:#B3BAD6; --ink-3:#8A93B5;
    --brand:#8F9CFF; --brand-strong:#B4BDFF; --brand-soft:#1F295C; --brand-ink:#0A0E21; --logo:#4C5CF0;
    --marker:#F2C94C; --marker-band:rgba(242,201,76,.38);
    --ok:#4FD19A; --ok-soft:rgba(79,209,154,.14); --ok-ink:#0A0E21;
    --warn:#F5B94F; --warn-soft:rgba(245,185,79,.14);
    --bad:#FF7F88; --bad-soft:rgba(255,127,136,.14);
    --teal:#3CD6CF; --amber:#F7C04A; --pink:#FF7FB6; --violet:#A98BFF; --coral:#FF8A63;
    --night:#060919; --night-2:#0F1435;
    --grid:rgba(143,156,255,.05);
    --scan-bg:#E6EAF4; --scan-grid:rgba(51,70,217,.15); --scan-ink:#1D3A9A;
    --scrim:rgba(0,0,0,.62);
    --shadow-1:0 1px 2px rgba(0,0,0,.35);
    --shadow-2:0 2px 4px rgba(0,0,0,.3),0 18px 40px -8px rgba(0,0,0,.55);
    --shadow-3:0 30px 80px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0A0E21; --surface:#121833; --surface-2:#192041; --surface-3:#232B54;
  --line:#252E57; --line-strong:#3A4472;
  --ink:#E9ECFA; --ink-2:#B3BAD6; --ink-3:#8A93B5;
  --brand:#8F9CFF; --brand-strong:#B4BDFF; --brand-soft:#1F295C; --brand-ink:#0A0E21; --logo:#4C5CF0;
  --marker:#F2C94C; --marker-band:rgba(242,201,76,.38);
  --ok:#4FD19A; --ok-soft:rgba(79,209,154,.14); --ok-ink:#0A0E21;
  --warn:#F5B94F; --warn-soft:rgba(245,185,79,.14);
  --bad:#FF7F88; --bad-soft:rgba(255,127,136,.14);
  --teal:#3CD6CF; --amber:#F7C04A; --pink:#FF7FB6; --violet:#A98BFF; --coral:#FF8A63;
  --night:#060919; --night-2:#0F1435;
  --grid:rgba(143,156,255,.05);
  --scan-bg:#E6EAF4; --scan-grid:rgba(51,70,217,.15); --scan-ink:#1D3A9A;
  --scrim:rgba(0,0,0,.62);
  --shadow-1:0 1px 2px rgba(0,0,0,.35);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 18px 40px -8px rgba(0,0,0,.55);
  --shadow-3:0 30px 80px -20px rgba(0,0,0,.7);
}

html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:700}
p{margin:0}
ul{margin:0;padding:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.num,table.data td,.k-value{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::selection{background:var(--marker-band);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mt{margin-top:16px}.mt-l{margin-top:24px}
.row-gap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

/* ---------- motion library ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseBlur{from{opacity:0;transform:translateY(.35em);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes popOut{to{opacity:0;transform:translateY(8px) scale(.97)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
@keyframes shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(var(--r,0deg))}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.12)}66%{transform:translate(-30px,20px) scale(.94)}100%{transform:translate(0,0) scale(1)}}
@keyframes marker{from{background-size:0% 100%}to{background-size:100% 100%}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes spinAng{to{--ang:360deg}}
@keyframes shine{from{transform:translateX(-130%) skewX(-18deg)}to{transform:translateX(260%) skewX(-18deg)}}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes dotRun{0%{left:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{left:calc(100% - 8px);opacity:0}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
@keyframes flash{0%{background-color:color-mix(in srgb,var(--ok) 28%,transparent)}100%{background-color:transparent}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}

/* icons + logo */
.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--brand);font-weight:800}
.logo{width:32px;height:32px;flex:none;transition:transform .5s var(--spring)}
.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}

/* buttons */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .18s,border-color .18s,color .18s,transform .18s var(--ease),box-shadow .2s}
.btn:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 72%,var(--violet)));border-color:transparent;color:var(--brand-ink);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--brand) 75%,transparent)}
.btn.primary:hover{background:linear-gradient(135deg,var(--brand-strong),color-mix(in srgb,var(--brand-strong) 70%,var(--violet)));box-shadow:0 12px 24px -8px color-mix(in srgb,var(--brand) 80%,transparent)}
.btn.primary::after,.btn.ok::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(-130%) skewX(-18deg);z-index:-1;pointer-events:none}
.btn.primary:hover::after,.btn.ok:hover::after{animation:shine .8s var(--ease)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--ok-ink);box-shadow:0 8px 18px -10px var(--ok)}
.btn.ok:hover{background:color-mix(in srgb,var(--ok) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.soft:hover{background:color-mix(in srgb,var(--brand) 20%,var(--surface))}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{min-height:31px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.xs{min-height:26px;padding:0 8px;font-size:12px;border-radius:7px}
.btn.icon{width:38px;padding:0}
.btn.block{width:100%}
.btn .i{width:17px;height:17px;transition:transform .25s var(--spring)}
.btn:hover .i{transform:translateX(1px) scale(1.08)}
.btn.lg{min-height:50px;padding:0 22px;font-size:16px;border-radius:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sweep .8s linear infinite;flex:none}

/* forms */
.field{display:grid;gap:6px}
.label{font-size:13px;font-weight:700;color:var(--ink-2)}
.input,.select,.textarea{width:100%;box-sizing:border-box;border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:8px 12px;min-height:40px;line-height:1.4;transition:border-color .2s,box-shadow .2s}
.textarea{min-height:64px;resize:vertical}
.textarea.sm{min-height:52px;font-size:14px}
.input:hover,.select:hover,.textarea:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line-strong))}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 18%,transparent)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.select.inline{width:auto;min-height:36px}
.check{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.form-error{color:var(--bad);font-weight:700;font-size:14px;min-height:0;animation:fadeIn .25s}
.form-error:empty{display:none}
.hint{font-size:13px;color:var(--ink-3)}

/* chips + badges */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;border:0;line-height:1}
.chip .i{width:13px;height:13px}
button.chip{cursor:pointer;transition:transform .2s var(--spring)}
button.chip:hover{transform:scale(1.05)}
.chip.blue{background:var(--brand-soft);color:var(--brand)}
.chip.green{background:var(--ok-soft);color:var(--ok)}
.chip.amber{background:var(--warn-soft);color:var(--warn)}
.chip.red{background:var(--bad-soft);color:var(--bad)}
.chip.dot::before,.tl::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip.green.dot::before,#ai-chip.green::before{animation:livePulse 1.8s ease-out infinite}
.tl{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tl.g{color:var(--ok);background:var(--ok-soft)}
.tl.y{color:var(--warn);background:var(--warn-soft)}
.tl.r{color:var(--bad);background:var(--bad-soft)}
.mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;font-weight:800;font-family:var(--f-display);font-size:15px}
.mk5{background:var(--ok-soft);color:var(--ok)}
.mk4{background:var(--brand-soft);color:var(--brand)}
.mk3{background:var(--warn-soft);color:var(--warn)}
.mk2{background:var(--bad-soft);color:var(--bad)}
.tbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-3);min-width:80px;gap:2px}
.tbar span{display:block;height:100%}
.tbar .g{background:var(--ok)}.tbar .y{background:var(--amber)}.tbar .r{background:var(--bad)}
.avatar{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);background:linear-gradient(135deg,var(--brand-soft),color-mix(in srgb,var(--teal) 18%,var(--surface)));color:var(--brand);flex:none;font-size:14px}
.avatar.lg{width:56px;height:56px;border-radius:16px;font-size:20px;background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff;box-shadow:0 10px 24px -10px var(--brand)}
mark.hl{background:linear-gradient(transparent 58%,var(--marker-band) 58%,var(--marker-band) 92%,transparent 92%) no-repeat;background-size:100% 100%;color:inherit;padding:0 .06em}

/* cards, lists, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);min-width:0;transition:box-shadow .25s,border-color .25s}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:16px;display:flex;align-items:center;gap:8px}
.card-h h3 .i{color:var(--brand)}
.card-h .sub{font-size:13px;color:var(--ink-3);font-weight:400;font-family:var(--f-body)}
.card-b{padding:16px 18px}
.card-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:grid}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);min-width:0}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.lrow .title{font-weight:700}
.lrow .meta{font-size:13px;color:var(--ink-3)}
.lrow > .i{color:var(--ink-3)}
button.lrow{width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;transition:background .18s,padding .25s var(--ease)}
button.lrow:first-child{border-top:0}
button.lrow:hover{background:var(--surface-2);padding-left:22px}
.card > .list > button.lrow:last-child{border-radius:0 0 17px 17px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.data th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
table.data td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;transition:background .15s}
table.data tr:last-child td{border-bottom:0}
table.data .n{text-align:right}
table.data .c{text-align:center}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
table.data tbody tr.click:hover td{background:var(--surface-2)}
table.data .stick{position:sticky;left:0;background:var(--surface);z-index:1}
.cellbtn{border:0;background:transparent;padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;transition:background .15s,color .15s,transform .2s var(--spring)}
.cellbtn:hover{background:var(--brand-soft);color:var(--brand);transform:scale(1.1)}
.edited{font-size:11px;color:var(--warn);font-weight:700;margin-left:2px}

/* banners */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--brand-soft);color:var(--ink);font-size:14px;border:1px solid color-mix(in srgb,var(--brand) 14%,transparent)}
.banner .i{color:var(--brand);margin-top:2px}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 18%,transparent)} .banner.warn .i{color:var(--warn)}
.banner.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 18%,transparent)} .banner.ok .i{color:var(--ok)}
.banner.bad{background:var(--bad-soft)} .banner.bad .i{color:var(--bad)}
.banner .grow{flex:1}

/* grids */
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.stack-v{display:grid;gap:16px;min-width:0}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:minmax(0,1fr)}}

/* KPI */
.kpi{position:relative;overflow:hidden;padding:17px 18px;display:grid;gap:4px;align-content:start;--kc:var(--brand)}
.kpi::after{content:"";position:absolute;right:-46px;top:-46px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--kc) 24%,transparent),transparent 68%);pointer-events:none;transition:transform .6s var(--ease)}
.kpi:hover::after{transform:scale(1.35)}
.grid > .kpi:nth-child(4n+2),.grid > .kpi:nth-child(4n+2){--kc:var(--teal)}
.grid > .kpi:nth-child(4n+3){--kc:var(--amber)}
.grid > .kpi:nth-child(4n+4){--kc:var(--pink)}
.k-label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi > .k-label::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--kc);flex:none}
.k-value{font-family:var(--f-display);font-size:31px;font-weight:800;letter-spacing:-.025em;line-height:1.1;position:relative}
.k-sub{font-size:13px;color:var(--ink-3);position:relative}
.k-sub .tbar{margin-top:8px}

/* ================= landing ================= */
.site{min-height:100%;background:var(--paper);overflow-x:clip}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px;box-sizing:border-box}
@media (max-width:640px){.wrap{padding-inline:16px}}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s,background .3s}
.topnav.scrolled{border-bottom-color:var(--line);box-shadow:0 10px 30px -18px rgba(17,23,51,.25);background:color-mix(in srgb,var(--paper) 86%,transparent)}
.topnav .wrap{display:flex;align-items:center;gap:16px;height:68px;transition:height .3s var(--ease)}
.topnav.scrolled .wrap{height:60px}
.progress-line{position:absolute;left:0;bottom:-1px;height:3px;width:100%;transform-origin:left;transform:scaleX(var(--p,0));background:linear-gradient(90deg,var(--brand),var(--teal),var(--amber),var(--pink))}
.navlinks{display:flex;gap:2px;margin-left:auto}

.pipe li:nth-child(1){--pc:#6C7BFF}.pipe li:nth-child(2){--pc:#3CD6CF}.pipe li:nth-child(3){--pc:#4FD19A}.pipe li:nth-child(4){--pc:#FFD23F}

.stage{position:relative;min-height:440px;display:grid;place-items:center;padding:28px 10px}

.verdict{position:absolute;right:max(0px,calc(50% - 280px));bottom:34px;width:250px;padding:14px 16px;border-radius:18px;background:rgba(22,29,72,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:grid;gap:8px;color:#fff}

@media (max-width:560px){.verdict{position:relative;right:auto;bottom:auto;width:auto;margin-top:-20px}.stage{display:grid;gap:0}.stamp{left:4px}.synced{position:relative;left:auto;justify-self:start;margin-top:10px}.hand{font-size:34px}}
/* staged states: only while the demo is running */

.v-sync{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.v-cmd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tile:hover .v-langs span:nth-child(1){transform:translateY(-3px)}.tile:hover .v-langs span:nth-child(2){transform:translateY(-5px);transition-delay:.05s}.tile:hover .v-langs span:nth-child(3){transform:translateY(-3px);transition-delay:.1s}

/* roles */

/* pricing */

.plan{padding:24px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:grid;gap:12px;align-content:start;transition:transform .45s var(--spring),box-shadow .3s}

/* call to action + footer */
.cta{position:relative;overflow:clip;background:var(--marker);color:#141E31;padding-block:80px}

.cta .btn.primary{background:#141E31;color:#FFD23F;box-shadow:0 14px 28px -12px rgba(20,30,49,.6)}
.foot{padding-block:40px;background:var(--night);color:var(--night-ink-2)}

.foot p{color:var(--night-ink-2);font-size:13px;max-width:60ch}
.foot .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}

/* ================= app shell ================= */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:16px;padding:20px 14px;background:var(--surface);border-right:1px solid var(--line);box-sizing:border-box;overflow-y:auto;background-image:radial-gradient(260px 200px at 0% 0%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 70%),radial-gradient(240px 220px at 100% 100%,color-mix(in srgb,var(--teal) 8%,transparent),transparent 70%)}
.side .brand{padding:2px 8px}
.who{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface-2);min-width:0;border:1px solid var(--line)}
.who .avatar{background:linear-gradient(135deg,var(--brand),var(--violet));color:#fff}
.who div strong{display:block;font-size:14px;line-height:1.25}
.who div span{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.who > div{min-width:0}
.nav{display:grid;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:11px;background:transparent;color:var(--ink-2);font-weight:700;font-size:14px;cursor:pointer;text-align:left;transition:background .2s,color .2s,padding .25s var(--ease)}
.nav button .i{transition:transform .3s var(--spring)}
.nav button:hover{background:var(--surface-2);color:var(--ink);padding-left:15px}
.nav button:hover .i{transform:scale(1.12)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 30%,transparent));color:var(--brand)}
.nav button::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--brand);transform:scaleY(0)}
.nav button[aria-current="page"]::before{transform:scaleY(1)}
.shell.routed .nav button[aria-current="page"]::before{animation:growY .45s var(--spring)}
.nav .count{margin-left:auto;font-size:12px;background:var(--amber);color:#1B1300;border-radius:99px;padding:1px 8px;font-variant-numeric:tabular-nums;min-width:12px;text-align:center}
.side-foot{margin-top:auto;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.role-note{font-size:12px;color:var(--ink-3);display:flex;gap:8px;padding:0 6px}
.role-note .i{width:15px;height:15px;margin-top:2px;color:var(--brand)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:12px;min-height:62px;padding-inline:24px;background:color-mix(in srgb,var(--paper) 78%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line);box-sizing:border-box}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-3);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:26px;max-width:1260px;width:100%;box-sizing:border-box;margin-inline:auto;min-width:0}
.menu-btn{display:none!important}
.scrim{display:none}
@media (min-width:901px){
  .shell.boot .side{animation:slideIn .6s var(--ease) backwards}
  .shell.boot .nav button{animation:slideIn .5s var(--ease) backwards}
  .shell.boot .nav button:nth-child(2){animation-delay:.04s}.shell.boot .nav button:nth-child(3){animation-delay:.08s}.shell.boot .nav button:nth-child(4){animation-delay:.12s}.shell.boot .nav button:nth-child(5){animation-delay:.16s}.shell.boot .nav button:nth-child(6){animation-delay:.2s}.shell.boot .nav button:nth-child(7){animation-delay:.24s}.shell.boot .nav button:nth-child(8){animation-delay:.28s}
  .shell.boot .topbar{animation:fadeIn .6s .1s backwards}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:40;transform:translateX(-105%);transition:transform .35s var(--ease);box-shadow:var(--shadow-3);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:35;animation:fadeIn .3s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .menu-btn{display:inline-flex!important}
  .content{padding:16px}
  .topbar{padding-inline:12px}
  .crumbs .hide-s{display:none}
}
/* page entrance: runs only when the page changes */
.content.enter > *{animation:rise .55s var(--ease) backwards}
.content.enter > :nth-child(2){animation-delay:.05s}.content.enter > :nth-child(3){animation-delay:.1s}.content.enter > :nth-child(4){animation-delay:.15s}.content.enter > :nth-child(5){animation-delay:.2s}.content.enter > :nth-child(6){animation-delay:.25s}
.content.enter .grid > *,.content.enter .stack-v > *{animation:pop .6s var(--ease) backwards}
.content.enter .grid > :nth-child(2),.content.enter .stack-v > :nth-child(2){animation-delay:.07s}
.content.enter .grid > :nth-child(3),.content.enter .stack-v > :nth-child(3){animation-delay:.14s}
.content.enter .grid > :nth-child(4),.content.enter .stack-v > :nth-child(4){animation-delay:.21s}
.content.enter .list > *,.content.enter .papers > *{animation:rise .5s var(--ease) backwards}
.content.enter .list > :nth-child(2),.content.enter .papers > :nth-child(2){animation-delay:.04s}.content.enter .list > :nth-child(3),.content.enter .papers > :nth-child(3){animation-delay:.08s}.content.enter .list > :nth-child(4),.content.enter .papers > :nth-child(4){animation-delay:.12s}.content.enter .list > :nth-child(5),.content.enter .papers > :nth-child(5){animation-delay:.16s}.content.enter .list > :nth-child(6),.content.enter .papers > :nth-child(6){animation-delay:.2s}.content.enter .list > :nth-child(n+7),.content.enter .papers > :nth-child(n+7){animation-delay:.24s}
.content.enter table.data tbody tr{animation:fadeIn .5s backwards}
.content.enter table.data tbody tr:nth-child(2){animation-delay:.03s}.content.enter table.data tbody tr:nth-child(3){animation-delay:.06s}.content.enter table.data tbody tr:nth-child(4){animation-delay:.09s}.content.enter table.data tbody tr:nth-child(5){animation-delay:.12s}.content.enter table.data tbody tr:nth-child(6){animation-delay:.15s}.content.enter table.data tbody tr:nth-child(7){animation-delay:.18s}.content.enter table.data tbody tr:nth-child(n+8){animation-delay:.21s}
.content.enter .chart .bar{animation:growY .9s var(--ease) backwards;animation-delay:calc(.25s + var(--i,0) * .08s)}
.content.enter .chart .val{animation:fadeIn .5s backwards;animation-delay:calc(.7s + var(--i,0) * .08s)}
.content.enter .meter span,.content.enter .tbar,.content.enter .progress span{animation:growX 1s .25s var(--ease) backwards;transform-origin:left}
.content.enter .heat td.cell{animation:pop .5s backwards;animation-delay:.2s}

.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:clamp(26px,3.2vw,34px);font-weight:800;letter-spacing:-.03em}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}

/* review */

button.paper:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}

/* ---------- queries ---------- */
const byId = (arr, id) => arr.find((x) => x.id === id);
const cls = (id) => byId(DB.classes, id);
const clsName = (id) => (cls(id) || {}).name || id;

const asg = (id) => byId(DB.assignments, id);
const subById = (id) => byId(DB.submissions, id);
const studentsOf = (cid) => DB.students.filter((s) => s.classId === cid);
const subsOf = (aid) => DB.submissions.filter((s) => s.assignmentId === aid);
const subFor = (aid, sid) => DB.submissions.find((s) => s.assignmentId === aid && s.studentId === sid);
const me = () => (SESSION ? byId(DB.users, SESSION.userId) : null);
const myStudent = () => { const u = me(); return u && u.studentId ? stu(u.studentId) : null; };
const myTeacher = () => { const u = me(); return u ? DB.teachers.find((t) => t.userId === u.id) : null; };
const teacherClasses = () => { const t = myTeacher(); return t ? t.classes : []; };
const teacherAsgs = () => DB.assignments.filter((a) => teacherClasses().includes(a.classId)).sort((a, b) => b.date - a.date);
const can = (p) => { const u = me(); return !!u && PERMS[u.role].has(p); };
const answerOf = (s, qn) => { const x = (s.answers || []).find((y) => y.qid === qn); return x ? x.text : ''; };
const qOf = (a, qn) => a.questions.find((q) => q.n === qn);

function item(s, q) {
  const ai = s.ai && s.ai.items ? s.ai.items.find((i) => i.qid === q.n) : null;
  const r = (s.review && s.review.items && s.review.items[q.n]) || {};
  if (!ai && r.points == null) return null;
  const points = r.points != null ? r.points : (ai ? ai.points : 0);
  const mistake = points >= q.points ? 'none' : (r.mistake || (ai && ai.mistake) || 'other');
  return {
    qid: q.n, read: ai ? ai.read : '', aiPoints: ai ? ai.points : null, points, conf: ai ? ai.conf : 1,
    why: ai ? ai.why : '', mistake, feedback: r.feedback != null ? r.feedback : (ai ? ai.feedback : ''),
    approved: !!r.approved, touched: !!r.touched, blur: !!(ai && ai.blur)
  };
}
const isSuggested = (s) => !!(s.ai && s.ai.status === 'done');
function rawTotal(s, a) { return sum(a.questions.map((q) => { const it = item(s, q); return it ? it.points : 0; })); }
function total(s, a) { return s.override ? s.override.points : rawTotal(s, a); }
const pctOf = (s, a) => total(s, a) / a.points;
function markFor(p) { const g = DB.settings.scale; const v = p * 100; return v >= g[5] ? 5 : v >= g[4] ? 4 : v >= g[3] ? 3 : 2; }
function lightOf(conf) { const t = DB.settings.trust; return conf >= t.green ? 'g' : conf >= t.red ? 'y' : 'r'; }
function paperLight(s, a) { let w = 'g'; for (const q of a.questions) { const it = item(s, q); if (!it) continue; const l = lightOf(it.conf); if (l === 'r') return 'r'; if (l === 'y') w = 'y'; } return w; }
const paperApproved = (s, a) => a.questions.every((q) => { const it = item(s, q); return it && it.approved; });
const unpublished = (a) => subsOf(a.id).filter((s) => !s.published);
const needsAI = (a) => unpublished(a).filter((s) => !isSuggested(s));
const pendingCount = (a) => unpublished(a).filter((s) => !isSuggested(s) || !paperApproved(s, a)).length;
function lightCounts(a) { const c = { g: 0, y: 0, r: 0 }; unpublished(a).forEach((s) => { if (isSuggested(s) && !paperApproved(s, a)) c[paperLight(s, a)]++; }); return c; }
function overallOf(s) { return (s.review && s.review.overall != null) ? s.review.overall : (s.ai ? s.ai.overall : ''); }

function asgStats(a, publishedOnly) {
  const subs = subsOf(a.id).filter((s) => isSuggested(s) && (!publishedOnly || s.published));
  const pcts = subs.map((s) => pctOf(s, a));
  const dist = { 5: 0, 4: 0, 3: 0, 2: 0 }; pcts.forEach((p) => { dist[markFor(p)]++; });
  return { n: subs.length, avg: avg(pcts), dist, pcts };
}
function radar(a) {
  const subs = subsOf(a.id).filter(isSuggested);
  const map = {};
  subs.forEach((s) => a.questions.forEach((q) => {
    const it = item(s, q);
    if (it && !['none', 'unclear', 'other'].includes(it.mistake)) {
      map[it.mistake] = map[it.mistake] || { tag: it.mistake, students: new Set(), qs: new Set(), reads: [] };
      map[it.mistake].students.add(s.studentId); map[it.mistake].qs.add(q.n);
      if (it.read && map[it.mistake].reads.length < 5) map[it.mistake].reads.push('Q' + q.n + ': ' + it.read);
    }
  }));
  return Object.values(map).map((m) => ({ tag: m.tag, students: [...m.students], qs: [...m.qs], reads: m.reads, pct: subs.length ? m.students.size / subs.length : 0 }))
    .sort((x, y) => y.students.length - x.students.length).slice(0, 3);
}
function studentQuarter(sid) {
  const s = stu(sid); if (!s) return null;
  let got = 0, max = 0, n = 0;
  DB.assignments.filter((a) => a.classId === s.classId).forEach((a) => { const sb = subFor(a.id, sid); if (sb && sb.published) { got += total(sb, a); max += a.points; n++; } });
  return n ? { pct: got / max, n } : null;
}
function attStats(sid) {
  const s = stu(sid); const days = (s && DB.attendance[s.classId]) || {};
  let p = 0, l = 0, ab = 0;
  Object.keys(days).forEach((d) => { const v = days[d][sid]; if (v === 'P') p++; else if (v === 'L') l++; else if (v === 'A') ab++; });

function parseAttendance(text, studs) {
  const tokens = String(text).toLowerCase().replace(/[ʻ'’`]/g, '').split(/[\s,;:.!]+/).filter(Boolean);
  const KW = [['A', ['absent', 'absence', 'missing', 'kelmadi', 'kelmagan', 'yoq', 'отсутств', 'нет']], ['L', ['late', 'kechik', 'опоздал']], ['P', ['present', 'here', 'keldi', 'присутств']]];
  const kw = (t) => { for (const [st, words] of KW) if (words.some((w) => t.indexOf(w) === 0)) return st; return null; };
  const byFirst = {}; studs.forEach((s) => { byFirst[firstName(s.name).toLowerCase().replace(/[ʻ'’`]/g, '')] = s.id; });
  const res = {}; let pending = null; let buf = [];
  tokens.forEach((t) => {
    const st = kw(t);
    if (st) { if (buf.length) { buf.forEach((id) => { res[id] = st; }); buf = []; pending = null; } else pending = st; return; }
    const id = byFirst[t]; if (id) { if (pending) res[id] = pending; else buf.push(id); }
  });
  return res;
}

  [5, 4, 3, 2].forEach((m, i) => { const y = d.y + i * 18; d.text(M, y + 10, 'Mark ' + m, { size: 9.5, color: '#465370' }); const bl = (W - 110) * r.dist[m] / maxC; d.rect(M + 56, y + 1, Math.max(bl, 1.5), 11, { fill: cols[i] }); d.text(M + 62 + bl, y + 10, String(r.dist[m]), { size: 9.5, bold: true }); });

  const colsDef = [{ h: 'Student', w: 150, a: 'left' }].concat(r.asgCols.map((c) => ({ h: c, w: aw, a: 'right' })), [{ h: 'Average', w: 56, a: 'right' }, { h: 'Mark', w: 40, a: 'right' }, { h: 'Attendance', w: 62, a: 'right' }]);
  const header = () => { d.rect(M, d.y, W, 18, { fill: '#EDF0F7' }); let x = M; colsDef.forEach((c) => { d.text(c.a === 'right' ? x + c.w - 6 : x + 6, d.y + 12.5, c.h, { size: 8.5, bold: true, color: '#465370', align: c.a === 'right' ? 'right' : 'left', maxW: c.w - 8 }); x += c.w; }); d.y += 18; };

  'close-nav'() { UI.navOpen = false; render(); },
  'open-asg'(el) {
    const a = asg(el.dataset.id); if (!a) return;
    let tab = el.dataset.tab; if (!tab) tab = needsAI(a).length && !subsOf(a.id).some((s) => isSuggested(s) && !s.published) ? 'papers' : pendingCount(a) ? 'review' : 'results';
    UI.reviewQ = 1; UI.reviewFilter = 'all'; UI.reviewSub = null; UI.reviewMode = 'question';
    go('t-assignment', { id: a.id }, tab);
  },
  'asg-tab'(el) { UI.asgTab = el.dataset.tab; UI.animNext = true; render(); },
  'asg-filter'(el) { UI.asgFilter = el.dataset.v; render(); },
  'rv-mode'(el) { UI.reviewMode = el.dataset.v; UI.animNext = true; render(); },
  'rv-q'(el) { UI.reviewQ = Number(el.dataset.v); UI.reviewFilter = 'all'; render(); },
  'rv-filter'(el) { UI.reviewFilter = el.dataset.v; render(); },
  'rv-sub'(el) { UI.reviewSub = el.dataset.sub; render(); const c = $('#content'); if (c && window.innerWidth < 980) { const d = c.querySelector('.g-review > section:nth-child(2)'); if (d) d.scrollIntoView({ block: 'start' }); } },
  'open-paper'(el) { const s = subById(el.dataset.sub); if (!s) return; if (!isSuggested(s) || s.published) { UI.asgTab = s.published ? 'results' : 'papers'; if (!isSuggested(s)) toast('Suggest grades first to review this paper.'); render(); return; } UI.asgTab = 'review'; UI.reviewMode = 'student'; UI.reviewSub = s.id; render(); },
  'pts'(el) { const { s, a, qn } = keyParts(el); if (!s || s.published) return; setPoints(s, a, qn, Number(el.dataset.d)); render(); },
  'approve'(el) { const { s, a, qn } = keyParts(el); if (!s) return; approveItem(s, a, qn); render(); },
  'unapprove'(el) { const { s, a, qn } = keyParts(el); if (!s) return; unapproveItem(s, a, qn); render(); },
  'approve-paper'(el) { const s = subById(el.dataset.sub); const a = asg(el.dataset.asg); if (!s) return; if (redUnconfirmed(s, a)) { toast('Confirm the red answers first.', 'warn'); return; } approvePaper(s, a); audit('Approved paper', stu(s.studentId).name + ' · ' + a.short); const subs = subsOf(a.id).filter((x) => isSuggested(x) && !x.published && !paperApproved(x, a)); if (subs.length) UI.reviewSub = subs[0].id; render(); toast('Paper approved.'); },
  'approve-green'(el) { const a = asg(el.dataset.id); const n = approveAllGreen(a); render(); if (n) toast('Approved ' + n + ' green papers. Yellow and red ones still need you.'); },
  async 'rewrite'(el) {
    const { s, a, qn } = keyParts(el); if (!s) return; const key = el.dataset.key;
    UI.busy[key] = true; render();
    const text = await rewriteFeedback(s, a, qn, el.dataset.style);
    delete UI.busy[key]; setFeedback(s, qn, text); render();
  },
  'suggest'(el) { runSuggest(el.dataset.id); },
  'stop-ai'(el) { const b = UI.busy[el.dataset.id]; if (b && b.ctl) b.ctl.abort(); },
  'publish'(el) { const a = asg(el.dataset.id); if (canPublish(a).ok) openModal('publish', { aid: a.id }); },
  'confirm-publish'(el) { const a = asg(el.dataset.aid); const n = publish(a); UI.modal = null; UI.asgTab = 'results'; render(); if (n) toast('Published. ' + n + ' students can now see their results.'); },
  'sync'(el) { runSync(el.dataset.id); },
  'csv-asg'(el) { const a = asg(el.dataset.id); const t = csv(gradeRows([a])); DL.save('Tanaffus-' + clsName(a.classId) + '-' + a.short.replace(/\s+/g, '') + '.csv', t, t); audit('Downloaded CSV', a.short + ' · ' + clsName(a.classId)); },
  'csv-class'(el) { const cid = el.dataset.cls; const asgs = DB.assignments.filter((a) => a.classId === cid && subsOf(a.id).some((s) => s.published)); const t = csv(gradeRows(asgs)); DL.save('Tanaffus-' + clsName(cid) + '-gradebook.csv', t, t); audit('Exported gradebook', clsName(cid) + ' · CSV for eMaktab import'); },
  async 'reteach'(el) {
    const a = asg(el.dataset.id); const tag = el.dataset.tag;
    openModal('reteach', { aid: a.id, tag, loading: true });
    const plan = await reteachPlan(a, tag);
    const m = UI.modal; if (!m || m.type !== 'reteach' || m.data.tag !== tag) return;
    m.data.loading = false; m.data.plan = plan; renderModal();
  },
  'send-practice'(el) { const a = asg(el.dataset.aid); const tag = el.dataset.tag; const m = UI.modal; const plan = (m && m.data.plan) || RETEACH[tag] || RETEACH.other; const r = radar(a).find((x) => x.tag === tag); const n = sendPractice(a, tag, r ? r.students : [], plan); UI.modal = null; render(); toast('Practice sent to ' + n + ' students. They’ll see it on their home page.'); },
  'edit-grade'(el) { openModal('edit-grade', { sub: el.dataset.sub }); },
  'eg-save'(el) { const s = subById(el.dataset.sub); const a = asg(s.assignmentId); const v = Number($('#eg-pts').value); if (!isFinite(v) || v < 0 || v > a.points) { toast('Enter a score from 0 to ' + a.points + '.', 'warn'); return; } overrideGrade(s, a, Math.round(v), $('#eg-reason').value.trim()); UI.modal = null; render(); toast('Score updated and logged.'); },
  'eg-clear'(el) { const s = subById(el.dataset.sub); const a = asg(s.assignmentId); s.override = null; audit('Undid a grade change', stu(s.studentId).name + ' · ' + a.short); persist(); UI.modal = null; render(); toast('Change undone.'); },
  'att-class'(el) { UI.attClass = el.dataset.cls; UI.attDay = isoDay(Date.now()); go('t-attendance'); },
  'att-set'(el) { const d = UI.attDraft; if (!d) return; d.marks[el.dataset.sid] = el.dataset.v; if (!d.changed.includes(el.dataset.sid)) d.changed.push(el.dataset.sid); render(); },
  'att-save'() { const d = UI.attDraft; if (!d) return; saveAttendance(d.cid, d.day, d.marks); d.saved = true; d.changed = []; const c = countMarks(d.marks); render(); toast('Attendance saved for ' + clsName(d.cid) + ': ' + c.P + ' present, ' + c.L + ' late, ' + c.A + ' absent.'); },
  'open-student'(el) { UI.pnote = null; go('t-student', { id: el.dataset.id }); },
  'pn-lang'(el) { UI.pnLang = el.dataset.v; render(); },
  async 'pn-gen'(el) { const sid = el.dataset.id; const lang = UI.pnLang || DB.settings.lang; UI.pnote = { sid, busy: true, text: UI.pnote && UI.pnote.sid === sid ? UI.pnote.text : null }; render(); const text = await parentNote(sid, lang); UI.pnote = { sid, busy: false, text, lang }; render(); logTime(4, 'Parent notes drafted'); },
  'pn-sent'(el) { const sid = el.dataset.id; const t = ($('#pn-text') || {}).value || ''; DB.parentNotes.push({ sid, text: t, at: Date.now() }); audit('Parent note sent', stu(sid).name + ' · ' + LANGS[(UI.pnote && UI.pnote.lang) || DB.settings.lang]); toast('Marked as sent and logged.'); },
  'save-note'(el) { DB.notes[el.dataset.id] = ($('#pv-note') || {}).value || ''; persist(); toast('Private note saved.'); },
  'copy-el'(el) { const t = document.getElementById(el.dataset.el); if (t) copyText(t.value != null && t.tagName !== 'PRE' ? t.value : t.textContent); },
  async 'rep-gen'(el) { const cid = el.dataset.cls; const first = !(UI.report && UI.report.cid === cid); UI.repBusy = true; render(); const r = buildClassReport(cid); r.summary = await reportSummary(r); r.live = AI.live; UI.report = r; UI.repBusy = false; UI.animNext = true; audit('Generated class report', r.className + ' · ' + DB.school.quarter); if (first) logTime(20, 'Quarter report drafted'); render(); },
  'rep-pdf'() { exportFile('rep-pdf'); }, 'rep-csv'() { exportFile('rep-csv'); },
  'a-rep-gen'() { UI.aRep = buildSchoolReport(); UI.animNext = true; audit('Generated school report', 'Weekly summary · all classes'); render(); },
  'a-rep-pdf'() { exportFile('a-rep-pdf'); }, 'a-rep-csv'() { exportFile('a-rep-csv'); },
  'act-filter'(el) { UI.actFilter = el.dataset.v; render(); },
  'reset-demo'(el) {
    if (!el.dataset.confirm) { UI.confirmReset = true; render(); return; }
    const keep = SESSION; store.clear(); DB = buildSeed(); PHOTOS.clear(); UI.confirmReset = false; UI.report = null; UI.aRep = null; UI.attDraft = null; UI.pnote = null;
    SESSION = keep && byId(DB.users, keep.userId) ? keep : null; store.saveSession(SESSION); persist(); render(); toast('Demo data reset.');
  },
  'cancel-reset'() { UI.confirmReset = false; render(); },
  'open-upload'(el) {
    const d = { items: [] };
    if (el.dataset.id) d.asgId = el.dataset.id;
    openModal('upload', d);
    if (el.dataset.sid) d.presetSid = el.dataset.sid;
  },
  'up-sample'() { addSamplePaper(); },
  'up-remove'(el) { const d = UI.modal.data; const it = d.items[Number(el.dataset.i)]; if (it && it.url) { try { URL.revokeObjectURL(it.url); } catch (e) { /* ignore */ } } d.items.splice(Number(el.dataset.i), 1); renderModal(); },
  'run-upload'() { runUpload(); },
  'stop-upload'() { const m = UI.modal; if (m && m.data.ctl) m.data.ctl.abort(); },
  'photo'(el) { openModal('photo', { sub: el.dataset.sub }); },
  'ai-info'() { openModal('ai-info'); },
  'close-modal'() { const m = UI.modal; if (m && m.data && m.data.stage === 'running') return; closeModal(); },
  'overlay'(el, e) { if (e.target !== el) return; const m = UI.modal; if (m && m.data && (m.data.stage === 'running' || m.data.loading)) return; closeModal(); },
  'new-asg'() { openModal('new-asg', {}); },
  'nq-add'() { const d = UI.modal.data.draft; d.questions.push({ prompt: '', type: 'short', points: 2, key: '', rubric: '' }); renderModal(); },
  'nq-remove'(el) { const d = UI.modal.data.draft; d.questions.splice(Number(el.dataset.i), 1); renderModal(); },
  'na-save'() {
    const x = UI.modal.data.draft; const err = $('#na-err');
    if (!x.title.trim()) { err.textContent = 'Give the assignment a title.'; return; }
    if (x.questions.some((q) => !q.prompt.trim() || !q.key.trim())) { err.textContent = 'Every question needs the question text and an answer key.'; return; }
    const title = x.title.trim(); const shortM = title.split('·')[0].trim();
    const a = { id: uid('a'), classId: x.classId, title, short: shortM.length <= 12 ? shortM : TYPE_LABEL[x.type].split(' ')[0], type: x.type, mode: x.mode, subject: 'Mathematics', teacherId: 't1', date: Date.now(), due: fromIso(x.due) + 18 * 3600e3, status: 'open',
      questions: x.questions.map((q, i) => ({ n: i + 1, type: q.type, points: clamp(Math.round(Number(q.points) || 1), 1, 20), topic: 'Other', prompt: q.prompt.trim(), key: q.key.trim(), rubric: q.rubric.split('\n').map((r) => r.trim()).filter(Boolean), accept: [norm(q.key)], wrong: [] })) };
    a.points = sum(a.questions.map((q) => q.points));
    DB.assignments.push(a); audit('Created assignment', a.title + ' · ' + clsName(a.classId)); persist();
    UI.modal = null; go('t-assignment', { id: a.id }, 'papers');
    toast(a.mode === 'online' ? 'Assignment created. Students in ' + clsName(a.classId) + ' can hand in online now.' : 'Assignment created. Add photos of the papers when they’re in.');
  },
  's-open'(el) { go('s-submit', { id: el.dataset.id }); },
  's-result'(el) { go('s-grade', { id: el.dataset.id }); },
  's-subject'(el) { UI.sSubject = el.dataset.v; UI.animNext = true; render(); },
  'practice-done'(el) { const p = DB.practice.find((x) => x.id === el.dataset.id); if (p) { p.done = true; audit('Finished practice', p.title); persist(); } render(); toast('Nice work. Your teacher can see that you finished it.'); },
  'ins'(el) {
    const t = UI.lastInput && document.getElementById(UI.lastInput); if (!t) { toast('Click in an answer box first.', 'warn'); return; }
    const ch = el.dataset.ch; const st = t.selectionStart != null ? t.selectionStart : t.value.length; const en = t.selectionEnd != null ? t.selectionEnd : st;
    t.value = t.value.slice(0, st) + ch + t.value.slice(en); t.focus(); try { t.setSelectionRange(st + ch.length, st + ch.length); } catch (e) { /* ignore */ }
  }
};

/* ---------- change / input / submit ---------- */
const CHANGE = {
  'gb-class'(t) { UI.gbClass = t.value; render(); },
  'att-class'(t) { UI.attClass = t.value; render(); },
  'att-day'(t) { if (t.value) { UI.attDay = t.value; render(); } },
  'st-class'(t) { UI.stClass = t.value; render(); },
  'rep-class'(t) { UI.repClass = t.value; render(); },
  'blind'(t) { DB.settings.blind = t.checked; persist(); render(); },
  'liveai'(t) { DB.settings.liveAI = t.checked; persist(); render(); toast(t.checked ? 'Live AI will be used when available.' : 'Using demo AI.'); },
  'lang'(t) { DB.settings.lang = t.value; persist(); toast('New suggestions will use ' + LANGS[t.value] + ' feedback.'); },
  'scale'(t) { const m = Number(t.dataset.m); const v = Math.round(Number(t.value)); const sc = DB.settings.scale; const next = Object.assign({}, sc, { [m]: v }); if (!(v >= 1 && v <= 100 && next[5] > next[4] && next[4] > next[3])) { toast('Keep the thresholds in order: mark 5 above mark 4 above mark 3.', 'warn'); render(); return; } DB.settings.scale = next; persist(); render(); },
  'trust'(t) { const k = t.dataset.k; const v = Number(t.value) / 100; const tr = Object.assign({}, DB.settings.trust, { [k]: v }); if (!(tr.green > tr.red && tr.green <= 0.99 && tr.red >= 0.1)) { toast('Green must be higher than red.', 'warn'); render(); return; } DB.settings.trust = tr; persist(); render(); },
  'up-asg'(t) { const d = UI.modal.data; d.asgId = t.value; d.items = []; renderModal(); },
  'up-student'(t) { const d = UI.modal.data; const it = d.items[Number(t.dataset.i)]; if (it) it.sid = t.value; renderModal(); },
  'up-files'(t) {
    const d = UI.modal.data; const a = asg(d.asgId); const files = Array.from(t.files || []);
    const taken = new Set(d.items.map((x) => x.sid));
    const freeList = studentsOf(a.classId).filter((s) => !subFor(a.id, s.id) && !taken.has(s.id));
    if (d.presetSid) { const i = freeList.findIndex((s) => s.id === d.presetSid); if (i > 0) freeList.unshift(freeList.splice(i, 1)[0]); d.presetSid = null; }
    let skipped = 0;
    files.forEach((f) => { if (!/^image\//.test(f.type)) { skipped++; return; } const s = freeList.shift(); if (!s) { skipped++; return; } d.items.push({ url: URL.createObjectURL(f), blob: f, sid: s.id, sample: false }); });
    if (skipped) toast(skipped + ' file' + (skipped > 1 ? 's were' : ' was') + ' skipped: not an image, or no student left without work.', 'warn');
    renderModal();
  }
};
function onInput(e) {
  const t = e.target; const ds = t.dataset || {};
  if (ds.fb) { const [sid, qn] = ds.fb.split('|'); const s = subById(sid); if (s) setFeedback(s, Number(qn), t.value); }
  else if (ds.overall) { const s = subById(ds.overall); if (s) { s.review = s.review || { items: {} }; s.review.overall = t.value; persist(); } }
  else if (ds.pnote && UI.pnote) UI.pnote.text = t.value;
  else if (ds.repSummary && UI.report) UI.report.summary = t.value;
  else if (ds.draft && UI.modal && UI.modal.data.draft) UI.modal.data.draft[ds.draft] = t.value;
  else if (ds.q != null && UI.modal && UI.modal.data.draft) { const q = UI.modal.data.draft.questions[Number(ds.q)]; if (q) q[ds.f] = t.value; }
}
function onSubmit(e) {
  const f = e.target; e.preventDefault();
  if (f.id === 'login-form') { doLogin(f.username.value, f.password.value); return; }
  const kind = f.dataset.form;
  if (kind === 'att-cmd') {
    const inp = $('#att-cmd'); const d = UI.attDraft; if (!d || !inp) return;
    const res = parseAttendance(inp.value, studentsOf(d.cid)); const ids = Object.keys(res);
    if (!ids.length) { toast('No student names found. Try “absent Aziz, late Bekzod”.', 'warn'); return; }
    ids.forEach((id) => { d.marks[id] = res[id]; if (!d.changed.includes(id)) d.changed.push(id); });
    const word = { A: 'absent', L: 'late', P: 'present' };
    const summary = ['A', 'L', 'P'].map((st) => { const names = ids.filter((id) => res[id] === st).map((id) => firstName(stu(id).name)); return names.length ? names.join(', ') + ' ' + word[st] : ''; }).filter(Boolean).join('; ');
    render(); toast('Marked ' + summary + '. Press Save to keep it.');
    return;
  }
  if (kind === 's-submit') {
    const a = asg(f.dataset.id); const s = myStudent(); if (!a || !s) return;
    const answers = a.questions.map((q) => ({ qid: q.n, text: (f['q' + q.n] ? f['q' + q.n].value : '').trim() }));
    if (answers.every((x) => !x.text)) { toast('Write at least one answer before handing in.', 'warn'); return; }
    const photo = f.querySelector('#ans-photo'); const file = photo && photo.files && photo.files[0];
    const sb = submitOnline(a, s.id, answers, !!file);
    if (sb && file) PHOTOS.set(sb.id, { url: URL.createObjectURL(file), blob: file });
    persist(); go('s-assign'); toast('Handed in. Your teacher will review it.');
  }
}

/* ---------- boot ---------- */
async function initCapabilities() {
  const use = window.claude && typeof window.claude.use === 'function' ? (n) => window.claude.use(n) : null;
  if (!use) { AI.state = 'none'; refreshAiBits(); return; }
  const [sample, downloads] = await Promise.all([use('sample').catch(() => null), use('downloads').catch(() => null)]);
  AI.sample = sample || null; DL.api = downloads || null;
  if (AI.sample) { try { AI.limits = await AI.sample.limits(); } catch (e) { AI.limits = null; } }
  AI.state = AI.sample ? 'ready' : 'none';
  refreshAiBits();
}
function refreshAiBits() {
  const chip = $('#ai-chip'); if (chip) chip.outerHTML = aiChip();
  const t = $('#ai-status-text'); if (t) t.textContent = aiStatusText();
  if (UI.modal && UI.modal.type === 'ai-info') renderModal();
}
function boot() {
  document.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (!el) return; const fn = ACT[el.dataset.act]; if (!fn) return; if (el.tagName === 'A') e.preventDefault(); fn(el, e); });
  document.addEventListener('change', (e) => { const t = e.target; const k = t.dataset && t.dataset.change; if (k && CHANGE[k]) CHANGE[k](t, e); });
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmit);
  window.addEventListener('scroll', onLandScroll, { passive: true });
  document.addEventListener('pointermove', (e) => { const t = e.target.closest && e.target.closest('.tile'); if (!t) return; const r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px'); }, { passive: true });
  document.addEventListener('focusin', (e) => { const t = e.target; if (t && t.id && /^ans-\d+$/.test(t.id)) UI.lastInput = t.id; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (UI.modal) { const m = UI.modal; if (!(m.data && (m.data.stage === 'running'))) closeModal(); } else if (UI.navOpen) { UI.navOpen = false; render(); } } });
  if (SESSION && !me()) { SESSION = null; store.saveSession(null); }
  render();
  initCapabilities();
}
boot();

})();
</script>
